[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rifterm"
description = "rifterm — le marché, dans votre terminal. CLI open source de rif (Heat Index, pépites, rapports)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "soloofboom" }]
keywords = ["cli", "market", "finance", "rif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
]
dynamic = ["version"]

[project.scripts]
rifterm = "rifterm.cli:app"

[project.urls]
Homepage = "https://lerif.ca/rifterm"
Repository = "https://github.com/soloofboom/rifterm"
Changelog = "https://github.com/soloofboom/rifterm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

# Source unique de la version : src/rifterm/__init__.py (__version__) — le tag
# git et le paquet construit ne peuvent pas diverger.
[tool.hatch.version]
path = "src/rifterm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rifterm"]

# sdist à contenu déterministe : uniquement ces fichiers (aucun .github/, cache
# ou artefact local ne peut finir dans le paquet publié).
[tool.hatch.build.targets.sdist]
include = [
  "src/rifterm",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"