[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rifterm"
version = "0.1.0"
description = "rifterm — le marché, dans votre terminal. CLI open source de rif (Heat Index, pépites, rapports)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "soloofboom" }]
keywords = ["cli", "market", "finance", "rif"]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.scripts]
rifterm = "rifterm.cli:app"

[project.urls]
Homepage = "https://lerif.ca/rifterm"
Repository = "https://github.com/soloofboom/rifterm"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rifterm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"