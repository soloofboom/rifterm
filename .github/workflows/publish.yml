name: Publish to PyPI

# Publication uniquement sur push de tag (v*) — jamais sur PR ni branche.
# Trusted Publishing (OIDC) : aucun token PyPI stocké dans le repo, PyPI mint
# un jeton éphémère lié à (soloofboom/rifterm, ce fichier, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python3 -m pip install build --user
      - name: Build a wheel and a source distribution
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: [build]
    # Ceinture de sécurité explicite : même si le trigger plus haut change un
    # jour, ce job ne peut jamais tourner hors d'un tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rifterm
    permissions:
      id-token: write  # OIDC Trusted Publishing — obligatoire, scopé à ce job
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1